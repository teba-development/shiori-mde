[package]
name = "shiori-frontend-fs"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
crc32fast = "1"
dunce = "1"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation",
  "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_Security_Authorization", "Win32_System_SystemServices",
] }
