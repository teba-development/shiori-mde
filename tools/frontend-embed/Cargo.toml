[package]
name = "shiori-frontend-embed"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
proc-macro = true

[dependencies]
base64 = "0.22"
brotli = "9"
dunce = "1"
getrandom = "0.4"
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri-codegen = "2.7"
tauri-utils = { version = "2", features = ["html-manipulation-2"] }
windows-sys = { version = "0.61", features = [
  "Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation",
  "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO",
  "Win32_Security_Authorization", "Win32_System_SystemServices",
] }

[dev-dependencies]
tempfile = "3"
